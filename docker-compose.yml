version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: academia-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: academia
      MYSQL_USER: academia_user
      MYSQL_PASSWORD: academia_pass
    ports:
      - "3306:3306"
    volumes:
      - academia_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "academia_user", "-pacademia_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  academia_data:
