# =============================================
# ACADEMIA API - Configurações da Aplicação
# =============================================

spring.application.name=academia-api

# ---- Banco de Dados H2 (Desenvolvimento) ----
spring.datasource.url=jdbc:h2:mem:academiadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- Console H2 (acessível em /h2-console) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Para usar PostgreSQL em produção, substituir as configs acima por: ----
# spring.datasource.url=jdbc:postgresql://localhost:5432/academia
# spring.datasource.username=postgres
# spring.datasource.password=sua_senha
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=update

# ---- Inicialização de dados ----
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---- Servidor ----
server.port=8080
